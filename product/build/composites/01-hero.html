<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .stack{ position:absolute; left:270px; top:470px; width:460px; }
  .stack .paper{ position:absolute; inset:0; background:#fff; border-radius:6px; }
  .stack .p3{ transform:rotate(3.5deg) translateY(10px); box-shadow:0 20px 40px rgba(20,30,28,0.10); }
  .stack .p2{ transform:rotate(-2.5deg) translateY(4px); box-shadow:0 20px 40px rgba(20,30,28,0.10); }
  .stack img{ position:relative; width:100%; display:block; border-radius:6px; box-shadow:0 40px 90px rgba(20,30,28,0.25), 0 10px 24px rgba(20,30,28,0.12); transform:rotate(-1deg); }
  .copy{ position:absolute; left:70px; top:66px; width:820px; }
  .kicker{ font-size:15px; letter-spacing:0.22em; text-transform:uppercase; color:#2A6B6E; font-weight:700; margin-bottom:18px; }
  .copy h1{ font-size:52px; line-height:1.1; margin:0 0 18px; max-width:640px; }
  .copy .desc{ font-size:17px; color:#54544c; line-height:1.55; margin-bottom:22px; max-width:560px; }
  .badges{ display:flex; flex-wrap:wrap; gap:10px; }
  .badge{ background:#fff; border:1px solid #dedad0; border-radius:20px; padding:9px 18px; font-size:14px; font-weight:600; color:#2A6B6E; box-shadow:0 4px 14px rgba(20,30,28,0.06); }
</style></head>
<body><div class="canvas">
  <div class="brandmark">AleonPress</div>
  <div class="copy">
    <div class="kicker">Healthcare &amp; Medical Resume Template</div>
    <h1 class="headline">Land the Role You're Qualified For</h1>
    <div class="desc">A clean, modern resume template for nurses, physicians, therapists, medical staff, and healthcare executives — built to pass ATS scans and impress hiring managers.</div>
    <div class="badges">
      <div class="badge">ATS-Friendly</div>
      <div class="badge">Word &amp; PDF</div>
      <div class="badge">Instant Download</div>
    </div>
  </div>
  <div class="stack">
    <div class="paper p3"></div>
    <div class="paper p2"></div>
    <img src="../assets/resume-design1.png">
  </div>
</div></body></html>
