<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body{ background: radial-gradient(circle at 78% 15%, #E3EEEE 0%, #FAF9F5 45%); }
  .stack{ position:absolute; right:120px; top:90px; width:620px; height:1010px; }
  .stack .paper{ position:absolute; inset:0; background:#fff; border-radius:6px; }
  .stack .p3{ transform:rotate(3.5deg) translateY(10px); box-shadow:0 20px 40px rgba(20,30,28,0.10); }
  .stack .p2{ transform:rotate(-2.5deg) translateY(4px); box-shadow:0 20px 40px rgba(20,30,28,0.10); }
  .stack img{ position:relative; width:100%; border-radius:6px; box-shadow:0 40px 90px rgba(20,30,28,0.22), 0 10px 24px rgba(20,30,28,0.10); transform:rotate(-1deg); }
  .copy{ position:absolute; left:90px; top:300px; width:560px; }
  .kicker{ font-size:15px; letter-spacing:0.22em; text-transform:uppercase; color:#2A6B6E; font-weight:700; margin-bottom:22px; }
  .copy h1{ font-size:64px; line-height:1.08; margin:0 0 22px; }
  .copy .desc{ font-size:19px; color:#54544c; line-height:1.55; margin-bottom:30px; }
  .badges{ display:flex; flex-wrap:wrap; gap:10px; }
  .badge{ background:#fff; border:1px solid #dedad0; border-radius:20px; padding:9px 18px; font-size:14px; font-weight:600; color:#2A6B6E; }
</style></head>
<body><div class="canvas">
  <div class="brandmark">AleonPress</div>
  <div class="copy">
    <div class="kicker">Healthcare &amp; Medical Resume Template</div>
    <h1 class="headline">Land the Role You're<br>Qualified For</h1>
    <div class="desc">A clean, modern resume template for nurses, physicians, therapists, medical staff, and healthcare executives — built to pass ATS scans and impress hiring managers.</div>
    <div class="badges">
      <div class="badge">ATS-Friendly</div>
      <div class="badge">Word &amp; PDF</div>
      <div class="badge">Instant Download</div>
    </div>
  </div>
  <div class="stack">
    <div class="paper p3"></div>
    <div class="paper p2"></div>
    <img src="../assets/resume-design1.png">
  </div>
</div></body></html>
