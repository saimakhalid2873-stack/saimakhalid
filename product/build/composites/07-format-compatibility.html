<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body{ background:#FAF9F5; }
  .heading{ position:absolute; top:50%; left:0; right:0; transform:translateY(-260px); text-align:center; }
  .heading .kicker{ font-size:16px; letter-spacing:0.2em; text-transform:uppercase; color:#2A6B6E; font-weight:700; margin-bottom:16px; }
  .heading h1{ font-size:56px; margin:0; }
  .grid{ position:absolute; top:50%; left:0; right:0; transform:translateY(-30px); display:flex; justify-content:center; gap:26px; padding:0 90px; }
  .pill{ background:#fff; border:1.5px solid #E3EEEE; border-radius:14px; box-shadow:0 16px 36px rgba(20,30,28,0.08); width:232px; padding:38px 16px; text-align:center; }
  .pill .glyph{ width:64px; height:64px; border-radius:50%; background:#E3EEEE; color:#2A6B6E; display:flex; align-items:center; justify-content:center; font-family:'EB Garamond',serif; font-weight:700; font-size:24px; margin:0 auto 20px; }
  .pill .name{ font-size:18px; font-weight:700; color:#1c1c1c; }
</style></head>
<body><div class="canvas">
  <div class="brandmark">AleonPress</div>
  <div class="heading">
    <div class="kicker">Works Wherever You Do</div>
    <h1 class="headline">Compatible With</h1>
  </div>
  <div class="grid">
    <div class="pill"><div class="glyph">W</div><div class="name">Microsoft Word</div></div>
    <div class="pill"><div class="glyph">G</div><div class="name">Google Docs</div></div>
    <div class="pill"><div class="glyph">P</div><div class="name">Mac Pages</div></div>
    <div class="pill"><div class="glyph">US</div><div class="name">US Letter</div></div>
    <div class="pill"><div class="glyph">A4</div><div class="name">A4</div></div>
  </div>
</div></body></html>
