<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body{ background:#FAF9F5; }
  .heading{ position:absolute; top:80px; left:0; right:0; text-align:center; }
  .heading .kicker{ font-size:14px; letter-spacing:0.2em; text-transform:uppercase; color:#2A6B6E; font-weight:700; margin-bottom:14px; }
  .heading h1{ font-size:38px; margin:0; }
  .row{ position:absolute; top:230px; left:0; right:0; display:flex; justify-content:center; gap:60px; }
  .card{ width:520px; }
  .card img{ width:100%; box-shadow:0 30px 70px rgba(20,30,28,0.18), 0 8px 20px rgba(20,30,28,0.08); border-radius:4px; }
  .card .label{ text-align:center; margin-top:22px; font-size:17px; font-weight:700; color:#1c1c1c; }
</style></head>
<body><div class="canvas">
  <div class="brandmark">AleonPress</div>
  <div class="heading">
    <div class="kicker">Included In This Bundle</div>
    <h1 class="headline">A Matching Cover Letter &amp; References Page</h1>
  </div>
  <div class="row">
    <div class="card"><img src="../assets/cover-letter.png"><div class="label">Cover Letter</div></div>
    <div class="card"><img src="../assets/references.png"><div class="label">References Page</div></div>
  </div>
</div></body></html>
