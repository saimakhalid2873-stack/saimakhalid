<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .wrap{ position:absolute; top:50%; left:70px; width:850px; transform:translateY(-50%); }
  .heading{ text-align:left; margin-bottom:44px; }
  .heading .kicker{ font-size:14px; letter-spacing:0.2em; text-transform:uppercase; color:#2A6B6E; font-weight:700; margin-bottom:14px; }
  .heading h1{ font-size:34px; margin:0; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:26px; }
  .card{ background:#fff; border-radius:10px; box-shadow:0 20px 45px rgba(20,30,28,0.14); padding:24px 26px; display:flex; flex-direction:column; justify-content:center; }
  .card img{ width:100%; display:block; }
  .card .label{ margin-top:18px; font-size:16px; font-weight:700; color:#2A6B6E; text-transform:uppercase; letter-spacing:0.06em; }
</style></head>
<body><div class="canvas">
  <div class="brandmark">AleonPress</div>
  <div class="wrap">
    <div class="heading">
      <div class="kicker">Zoom In On The Details</div>
      <h1 class="headline">Designed Section by Section</h1>
    </div>
    <div class="grid">
      <div class="card"><img src="../assets/crop-header.png"><div class="label">Clean Header</div></div>
      <div class="card"><img src="../assets/crop-skills.png"><div class="label">Core Skills Row</div></div>
      <div class="card"><img src="../assets/crop-experience.png"><div class="label">Experience Entries</div></div>
      <div class="card"><img src="../assets/crop-licenses.png"><div class="label">Licenses &amp; Certifications</div></div>
    </div>
  </div>
</div></body></html>
