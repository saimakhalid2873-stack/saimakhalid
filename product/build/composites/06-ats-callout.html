<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body{ background:#FAF9F5; }
  .content{ position:absolute; top:50%; left:0; right:0; transform:translateY(-50%); text-align:center; padding:0 140px; }
  .badge{ display:inline-flex; align-items:center; gap:10px; background:#E3EEEE; color:#2A6B6E; border-radius:30px; padding:14px 30px; font-weight:700; font-size:18px; margin-bottom:38px; }
  .badge .checkmark{ font-size:18px; font-weight:800; }
  h1{ font-size:64px; margin:0 0 26px; }
  .desc{ font-size:23px; color:#54544c; margin-bottom:64px; }
  .rows{ display:flex; justify-content:center; gap:36px; }
  .row{ background:#fff; border-radius:12px; box-shadow:0 20px 45px rgba(20,30,28,0.10); padding:32px 34px; width:380px; text-align:left; display:flex; align-items:flex-start; gap:16px; }
  .row .mark{ color:#2A6B6E; font-size:24px; font-weight:800; }
  .row .t{ font-size:18.5px; font-weight:600; color:#1c1c1c; line-height:1.4; }
</style></head>
<body><div class="canvas">
  <div class="brandmark">AleonPress</div>
  <div class="content">
    <div class="badge"><span class="checkmark">✓</span>ATS-SAFE BY DESIGN</div>
    <h1 class="headline">Built to Pass ATS Scans</h1>
    <div class="desc">Single column · Real, selectable text · No tables or text boxes</div>
    <div class="rows">
      <div class="row"><span class="mark">✓</span><span class="t">Single-column layout, top to bottom</span></div>
      <div class="row"><span class="mark">✓</span><span class="t">Standard fonts &amp; section headers</span></div>
      <div class="row"><span class="mark">✓</span><span class="t">No tables, text boxes, or headers/footers</span></div>
    </div>
  </div>
</div></body></html>
