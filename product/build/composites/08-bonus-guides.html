<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body{ background:#FAF9F5; }
  .heading{ position:absolute; top:300px; left:90px; width:520px; }
  .kicker{ font-size:14px; letter-spacing:0.2em; text-transform:uppercase; color:#2A6B6E; font-weight:700; margin-bottom:16px; }
  .heading h1{ font-size:42px; margin:0 0 20px; line-height:1.15; }
  .list{ margin-top:10px; }
  .list .row{ display:flex; align-items:flex-start; margin-bottom:14px; font-size:17px; color:#333; }
  .list .row .mark{ color:#2A6B6E; font-weight:800; margin-right:12px; }
  .tracker-note{ margin-top:26px; background:#fff; border-left:3px solid #2A6B6E; border-radius:4px; padding:16px 20px; font-size:14.5px; color:#4a4a4a; }
  .fan{ position:absolute; right:60px; top:50%; transform:translateY(-50%); width:760px; height:900px; }
  .fan img{ position:absolute; width:480px; box-shadow:0 30px 60px rgba(20,30,28,0.20); border-radius:5px; }
  .fan img:nth-child(1){ left:0px; top:130px; transform:rotate(-9deg); }
  .fan img:nth-child(2){ left:100px; top:35px; transform:rotate(-3deg); }
  .fan img:nth-child(3){ left:200px; top:0px; transform:rotate(3deg); }
  .fan img:nth-child(4){ left:298px; top:75px; transform:rotate(9deg); }
</style></head>
<body><div class="canvas">
  <div class="brandmark">AleonPress</div>
  <div class="heading">
    <div class="kicker">Free With Every Purchase</div>
    <h1 class="headline">4 Bonus Career Guides</h1>
    <div class="list">
      <div class="row"><span class="mark">✓</span>Resume Writing Guide</div>
      <div class="row"><span class="mark">✓</span>ATS Resume Guide</div>
      <div class="row"><span class="mark">✓</span>Interview Preparation Guide</div>
      <div class="row"><span class="mark">✓</span>Job Search Playbook</div>
    </div>
    <div class="tracker-note">Plus a Job Application Tracker spreadsheet to keep every application organized from first click to offer.</div>
  </div>
  <div class="fan">
    <img src="../assets/cover-Resume-Writing-Guide.png">
    <img src="../assets/cover-ATS-Resume-Guide.png">
    <img src="../assets/cover-Interview-Preparation-Guide.png">
    <img src="../assets/cover-Job-Search-Playbook.png">
  </div>
</div></body></html>
