<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .content{ position:absolute; top:50%; left:70px; width:850px; transform:translateY(-50%); text-align:left; }
  .badge{ display:inline-flex; align-items:center; gap:10px; background:#E3EEEE; color:#2A6B6E; border-radius:30px; padding:12px 26px; font-weight:700; font-size:16px; margin-bottom:30px; }
  h1{ font-size:48px; margin:0 0 20px; line-height:1.1; }
  .desc{ font-size:19px; color:#54544c; margin-bottom:44px; }
  .rows{ display:flex; flex-direction:column; gap:18px; }
  .row{ background:#fff; border-radius:12px; box-shadow:0 20px 45px rgba(20,30,28,0.12); padding:22px 28px; text-align:left; display:flex; align-items:center; gap:16px; }
  .row .mark{ color:#2A6B6E; font-size:22px; font-weight:800; }
  .row .t{ font-size:17px; font-weight:600; color:#1c1c1c; line-height:1.4; }
</style></head>
<body><div class="canvas">
  <div class="brandmark">AleonPress</div>
  <div class="content">
    <div class="badge"><span class="checkmark">✓</span>ATS-SAFE BY DESIGN</div>
    <h1 class="headline">Built to Pass ATS Scans</h1>
    <div class="desc">Single column · Real, selectable text · No tables or text boxes</div>
    <div class="rows">
      <div class="row"><span class="mark">✓</span><span class="t">Single-column layout, top to bottom</span></div>
      <div class="row"><span class="mark">✓</span><span class="t">Standard fonts &amp; section headers</span></div>
      <div class="row"><span class="mark">✓</span><span class="t">No tables, text boxes, or headers/footers</span></div>
    </div>
  </div>
</div></body></html>
