<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .heading{ position:absolute; top:100px; left:70px; width:850px; }
  .kicker{ font-size:14px; letter-spacing:0.2em; text-transform:uppercase; color:#2A6B6E; font-weight:700; margin-bottom:14px; }
  .heading h1{ font-size:36px; margin:0 0 20px; line-height:1.15; }
  .list{ display:flex; flex-wrap:wrap; gap:10px 34px; margin-top:6px; }
  .list .row{ display:flex; align-items:center; font-size:16px; color:#333; width:380px; }
  .list .row .mark{ color:#2A6B6E; font-weight:800; margin-right:10px; }
  .tracker-note{ margin-top:20px; background:#fff; border-left:3px solid #2A6B6E; border-radius:4px; padding:14px 18px; font-size:13.5px; color:#4a4a4a; box-shadow:0 10px 26px rgba(20,30,28,0.08); }
  .fan{ position:absolute; left:296px; top:520px; width:420px; height:500px; }
  .fan img{ position:absolute; width:262px; box-shadow:0 24px 50px rgba(20,30,28,0.22); border-radius:5px; }
  .fan img:nth-child(1){ left:0px; top:71px; transform:rotate(-9deg); }
  .fan img:nth-child(2){ left:55px; top:19px; transform:rotate(-3deg); }
  .fan img:nth-child(3){ left:110px; top:0px; transform:rotate(3deg); }
  .fan img:nth-child(4){ left:163px; top:41px; transform:rotate(9deg); }
</style></head>
<body><div class="canvas">
  <div class="brandmark">AleonPress</div>
  <div class="heading">
    <div class="kicker">Free With Every Purchase</div>
    <h1 class="headline">4 Bonus Career Guides</h1>
    <div class="list">
      <div class="row"><span class="mark">✓</span>Resume Writing Guide</div>
      <div class="row"><span class="mark">✓</span>ATS Resume Guide</div>
      <div class="row"><span class="mark">✓</span>Interview Preparation Guide</div>
      <div class="row"><span class="mark">✓</span>Job Search Playbook</div>
    </div>
    <div class="tracker-note">Plus a Job Application Tracker spreadsheet to keep every application organized from first click to offer.</div>
  </div>
  <div class="fan">
    <img src="../assets/cover-Resume-Writing-Guide.png">
    <img src="../assets/cover-ATS-Resume-Guide.png">
    <img src="../assets/cover-Interview-Preparation-Guide.png">
    <img src="../assets/cover-Job-Search-Playbook.png">
  </div>
</div></body></html>
