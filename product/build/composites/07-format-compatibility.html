<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .heading{ position:absolute; top:390px; left:70px; width:850px; text-align:left; }
  .heading .kicker{ font-size:15px; letter-spacing:0.2em; text-transform:uppercase; color:#2A6B6E; font-weight:700; margin-bottom:16px; }
  .heading h1{ font-size:46px; margin:0; }
  .grid{ position:absolute; top:600px; left:70px; width:850px; display:flex; justify-content:space-between; gap:16px; }
  .pill{ background:#fff; border:1.5px solid #E3EEEE; border-radius:14px; box-shadow:0 16px 36px rgba(20,30,28,0.1); width:150px; padding:26px 10px; text-align:center; }
  .pill .glyph{ width:52px; height:52px; border-radius:50%; background:#E3EEEE; color:#2A6B6E; display:flex; align-items:center; justify-content:center; font-family:'EB Garamond',serif; font-weight:700; font-size:20px; margin:0 auto 16px; }
  .pill .name{ font-size:14.5px; font-weight:700; color:#1c1c1c; }
</style></head>
<body><div class="canvas">
  <div class="brandmark">AleonPress</div>
  <div class="heading">
    <div class="kicker">Works Wherever You Do</div>
    <h1 class="headline">Compatible With</h1>
  </div>
  <div class="grid">
    <div class="pill"><div class="glyph">W</div><div class="name">Microsoft Word</div></div>
    <div class="pill"><div class="glyph">G</div><div class="name">Google Docs</div></div>
    <div class="pill"><div class="glyph">P</div><div class="name">Mac Pages</div></div>
    <div class="pill"><div class="glyph">US</div><div class="name">US Letter</div></div>
    <div class="pill"><div class="glyph">A4</div><div class="name">A4</div></div>
  </div>
</div></body></html>
