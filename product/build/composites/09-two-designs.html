<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body{ background:#F1EFE9; }
  .heading{ position:absolute; top:70px; left:0; right:0; text-align:center; }
  .kicker{ font-size:14px; letter-spacing:0.2em; text-transform:uppercase; color:#2A6B6E; font-weight:700; margin-bottom:14px; }
  .heading h1{ font-size:38px; margin:0; }
  .row{ position:absolute; top:210px; left:0; right:0; display:flex; justify-content:center; gap:70px; }
  .card{ width:470px; }
  .card img{ width:100%; box-shadow:0 30px 70px rgba(20,30,28,0.18), 0 8px 20px rgba(20,30,28,0.08); border-radius:4px; }
  .card .label{ text-align:center; margin-top:22px; }
  .card .label .n{ font-size:13px; letter-spacing:0.12em; text-transform:uppercase; color:#2A6B6E; font-weight:700; }
  .card .label .t{ font-size:19px; font-weight:700; color:#1c1c1c; margin-top:4px; }
</style></head>
<body><div class="canvas">
  <div class="brandmark">AleonPress</div>
  <div class="heading">
    <div class="kicker">Choose Your Look</div>
    <h1 class="headline">2 Design Styles Included</h1>
  </div>
  <div class="row">
    <div class="card"><img src="../assets/resume-design1.png"><div class="label"><div class="n">Design 1</div><div class="t">The Educator — Clean Rule Headers</div></div></div>
    <div class="card"><img src="../assets/resume-design2.png"><div class="label"><div class="n">Design 2</div><div class="t">The Practitioner — Banner Headers</div></div></div>
  </div>
</div></body></html>
